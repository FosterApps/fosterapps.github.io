# Keeps every app page's App Store / Google Play buttons in step with the real listings.
# tools/store-buttons.mjs asks the stores whether each app is live and rewrites the generated
# button regions; when anything changed, this commits it and GitHub Pages republishes.
name: Store buttons

on:
  schedule:
    - cron: '17 13 * * *' # daily, 13:17 UTC
  push:
    branches: [main]
    paths:
      - stores.json
      - tools/store-buttons.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-buttons
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render store buttons from live store status
        run: node tools/store-buttons.mjs
      - name: Commit changed pages
        run: |
          if git diff --quiet; then
            echo "Store buttons already match the stores."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*/index.html'
          git commit -m "Store buttons: sync with live App Store / Google Play status"
          git push
